name: Database

# Keeps the hosted Supabase project in step with supabase/migrations.
#
# Every change is proved on a clean runner first: the verify job builds the
# database from nothing and seeds it, so a migration that only works against
# your machine cannot reach production.
#
# Repository secrets required (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL            postgresql://postgres.<ref>:<password>@<pooler-host>:5432/postgres
#   SUPABASE_URL               https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY  service_role key
#
# Use the pooler host, not db.<ref>.supabase.co: the direct host is IPv6 only
# and GitHub runners have no IPv6 route to it.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/seed.ts"
      - "scripts/seed/**"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/seed.ts"
      - "scripts/seed/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to the hosted project"
        type: boolean
        default: true
      seed_demo_data:
        description: "Load demo accounts and sample data"
        type: boolean
        default: false
      fresh_seed:
        description: "With seeding on, clear the dataset's rows first"
        type: boolean
        default: false

# Never let two runs write to the same database at once.
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Replays every migration in order against an empty database, which is
      # what the hosted project will do on its first push.
      - name: Start a local stack and replay migrations
        run: supabase start

      - name: Seed it
        run: npm run db:seed

      - name: Check the result
        run: |
          PSQL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$PSQL" -tAc "select 'tables: ' || count(*) from information_schema.tables where table_schema='public';"
          psql "$PSQL" -tAc "select 'accounts: ' || count(*) from auth.users;"

          # Guards the bug fixed in 20260731000100: a policy on
          # conversation_participants that queried its own table sent Postgres
          # into infinite recursion and took messaging down.
          psql "$PSQL" -v ON_ERROR_STOP=1 -tAc \
            "set role authenticated; select count(*) from public.conversation_participants;" \
            > /dev/null || { echo "conversation_participants is unreadable, check its RLS policies"; exit 1; }

          # The landing page reads this as an anonymous visitor, and it must
          # never become writable: it is a definer view onto profiles.
          psql "$PSQL" -v ON_ERROR_STOP=1 -tAc \
            "select has_table_privilege('anon','public.v_public_tutors','UPDATE');" \
            | grep -qx f || { echo "anon can write v_public_tutors, check the grants"; exit 1; }

          echo OK

      - name: Stop
        if: always()
        run: supabase stop --no-backup || true

  deploy:
    name: Apply migrations
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.apply_migrations)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set. Add it as a repository secret."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -tAc "select 'connected to ' || current_database();"

      - name: Show what will run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Confirm
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

  seed:
    name: Seed the hosted project
    needs: deploy
    # Manual only. Seeding rewrites profiles and can add conversations, so it
    # should be something you asked for rather than a side effect of a push.
    if: github.event_name == 'workflow_dispatch' && inputs.seed_demo_data
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_CONFIRM: "yes"
        run: |
          if [ "${{ inputs.fresh_seed }}" = "true" ]; then
            npx tsx scripts/seed.ts --target=remote --fresh
          else
            npx tsx scripts/seed.ts --target=remote
          fi
