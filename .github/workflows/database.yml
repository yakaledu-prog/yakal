name: Database

# Keeps the hosted project's schema in step with supabase/migrations, and can
# load the demo dataset into it for testing.
#
# Every change is proved locally first: the verify job builds the database from
# nothing on a clean runner and seeds it, so a migration that only works
# against your machine cannot reach the hosted project.
#
# Required repository secrets:
#   SUPABASE_DB_URL             postgresql://postgres.<ref>:<password>@<pooler-host>:5432/postgres
#   SUPABASE_URL                https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY   service_role key, server side only
#
# Use the pooler host, not db.<ref>.supabase.co. The direct host resolves to
# IPv6 only and GitHub runners have no IPv6 route to it.

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/seed.ts"
      - "scripts/seed/**"
      - ".github/workflows/database.yml"
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/seed.ts"
      - "scripts/seed/**"
      - ".github/workflows/database.yml"
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply pending migrations to the hosted project"
        type: boolean
        default: true
      seed_demo_data:
        description: "Load demo accounts and sample data into the hosted project"
        type: boolean
        default: true
      fresh_seed:
        description: "With seeding on, clear the dataset's rows first"
        type: boolean
        default: false
      adopt_existing_schema:
        description: "One time only. Marks the baseline as applied on a project that already has the schema."
        type: boolean
        default: false

# Never let two runs write to the same database at once.
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Build from scratch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Starting a local stack replays every migration in order against an
      # empty database. A migration that depends on something already present
      # on your machine fails here rather than in production.
      - name: Start a local stack and replay migrations
        run: supabase start

      - name: Seed it
        run: npm run db:seed

      - name: Check the result
        run: |
          PSQL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "Tables:"
          psql "$PSQL" -tAc \
            "select count(*) from information_schema.tables where table_schema='public';"

          echo "Seeded accounts:"
          psql "$PSQL" -tAc "select count(*) from auth.users;"

          # Guards the bug fixed in 20260731000100: a policy on
          # conversation_participants that queried its own table sent Postgres
          # into infinite recursion and took the whole messaging feature down.
          echo "Messaging reads without recursion:"
          psql "$PSQL" -v ON_ERROR_STOP=1 -tAc \
            "set role authenticated; select count(*) from public.conversation_participants;" \
            || { echo "conversation_participants is not readable, check the RLS policies"; exit 1; }

          echo "OK"

      - name: Stop
        if: always()
        run: supabase stop --no-backup || true

  deploy:
    name: Apply migrations to the hosted project
    needs: verify
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.apply_migrations)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check the connection
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set. Add it as a repository secret."
            exit 1
          fi
          psql "$SUPABASE_DB_URL" -tAc "select 'connected to ' || current_database();"

      # The hosted project was built by hand before this migration history
      # existed, so its tables are already there but its ledger is empty.
      # Replaying the baseline over it would fail on the first constraint that
      # already exists. This records the baseline as applied instead, so the
      # push starts from the migrations that come after it.
      - name: Adopt an existing schema
        if: github.event_name == 'workflow_dispatch' && inputs.adopt_existing_schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          BASELINE=$(ls supabase/migrations | head -1 | cut -d_ -f1)
          echo "Marking $BASELINE as already applied"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 <<SQL
          create schema if not exists supabase_migrations;
          create table if not exists supabase_migrations.schema_migrations (
            version text primary key
          );
          insert into supabase_migrations.schema_migrations (version)
          values ('$BASELINE')
          on conflict (version) do nothing;
          SQL

      - name: Show what will run
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

      - name: Push
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Confirm
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase migration list --db-url "$SUPABASE_DB_URL"

  seed:
    name: Seed the hosted project
    needs: deploy
    # Manual only. The accounts are throwaway and their password is public by
    # design, but reseeding still rewrites profiles and can add conversations,
    # so it should be something you asked for rather than a side effect of a
    # push.
    if: github.event_name == 'workflow_dispatch' && inputs.seed_demo_data
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seed
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_CONFIRM: "yes"
        run: |
          if [ "${{ inputs.fresh_seed }}" = "true" ]; then
            npx tsx scripts/seed.ts --target=remote --fresh
          else
            npx tsx scripts/seed.ts --target=remote
          fi
