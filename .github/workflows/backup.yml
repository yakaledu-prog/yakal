name: Backup

# A daily encrypted dump of the hosted database, pushed to a separate private
# repository.
#
# The Supabase free plan takes no backups at all. Not old ones, none. So this
# is the only copy of the data that exists outside the live database, and it
# stands in for the Pro plan's seven day retention at no cost.
#
# It is also better than that plan in one way: these dumps survive Supabase
# itself going wrong, because they are not stored there. Pro's own backups are.
#
# ---
#
# Repository secrets required (Settings > Secrets and variables > Actions):
#
#   SUPABASE_DB_URL     already set for the Database workflow. Use the pooler
#                       host, not db.<ref>.supabase.co: the direct host is IPv6
#                       only and GitHub runners have no IPv6 route to it.
#
#   BACKUP_PASSPHRASE   a long random string, kept somewhere that is not a
#                       repository. Without it the dumps are unreadable, so
#                       losing it loses the backups. openssl rand -base64 48
#
#   BACKUP_REPO         owner/name of a PRIVATE repository to push to,
#                       e.g. yakaledu-prog/yakal-backups
#
#   BACKUP_REPO_TOKEN   a fine-grained PAT with Contents: read and write on
#                       that repository and nothing else.
#
# ---
#
# Why a separate repository, and why the job checks it is private.
#
# This repository is public. An encrypted dump published to a public branch is
# downloadable by anyone forever, which turns a passphrase into the only thing
# standing between the world and an offline attack it can run for as long as it
# likes. AES256 with a long random passphrase is strong, but "children's names,
# parents' phone numbers and private messages, publicly downloadable" is not a
# sentence worth being one mistake away from.
#
# So the dumps never go here, and the job refuses to run if the target it is
# given turns out to be public. That check is not paranoia about today: it is
# what stops this quietly starting to publish personal data the day somebody
# flips that repository open.

on:
  schedule:
    # 07:12 UTC, a little after most of the US is asleep and nothing is being
    # written. The odd minute is deliberate: GitHub drops scheduled jobs that
    # land on a busy round hour.
    - cron: "12 7 * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why you are running this by hand"
        required: false

permissions:
  contents: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are there
        run: |
          if [ -z "${{ secrets.SUPABASE_DB_URL }}" ]; then
            echo "SUPABASE_DB_URL is not set. Nothing to back up."; exit 1
          fi
          if [ -z "${{ secrets.BACKUP_PASSPHRASE }}" ]; then
            echo "BACKUP_PASSPHRASE is not set. Refusing to write an unencrypted dump."; exit 1
          fi
          if [ -z "${{ secrets.BACKUP_REPO }}" ] || [ -z "${{ secrets.BACKUP_REPO_TOKEN }}" ]; then
            echo "BACKUP_REPO and BACKUP_REPO_TOKEN must both be set."
            echo "Backups do not go in this repository: it is public."
            exit 1
          fi

      # The one check that matters. Everything else here is plumbing; this is
      # what stops a dump of children's personal data becoming a public file.
      - name: Refuse to push anywhere public
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          REPO: ${{ secrets.BACKUP_REPO }}
        run: |
          set -euo pipefail
          VISIBILITY=$(gh api "repos/$REPO" --jq .visibility 2>/dev/null || echo "unreachable")

          if [ "$VISIBILITY" = "unreachable" ]; then
            echo "Could not read $REPO. Check BACKUP_REPO_TOKEN has Contents access to it."
            exit 1
          fi
          if [ "$VISIBILITY" != "private" ]; then
            echo "$REPO is $VISIBILITY. Refusing to write a database dump to it."
            exit 1
          fi
          echo "$REPO is private. Proceeding."

      # Supabase runs Postgres 17 and ubuntu-latest ships the 16 client, which
      # pg_dump refuses to use against a newer server.
      #
      # Installing 17 is not enough on its own: the runner already has 16 at
      # /usr/bin/pg_dump, which keeps winning on PATH. So the 17 binaries go on
      # the front of PATH and the next step asserts the version rather than
      # trusting that they did.
      - name: Install the Postgres 17 client
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

          # Fail here rather than three steps later with a version mismatch
          # that reads like a server problem.
          ACTUAL=$(/usr/lib/postgresql/17/bin/pg_dump --version)
          echo "$ACTUAL"
          case "$ACTUAL" in
            *" 17."*) ;;
            *) echo "Expected a 17 client, got: $ACTUAL"; exit 1 ;;
          esac

      - name: Dump, then encrypt
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +%F)

          # The absolute path, not PATH. GITHUB_PATH applies to later steps and
          # this one has already started, so relying on it here would silently
          # pick the runner's 16 again.
          PG_DUMP=/usr/lib/postgresql/17/bin/pg_dump
          "$PG_DUMP" --version

          # Plain SQL rather than the custom format: it compresses better and,
          # more importantly, it can be read and partially recovered by hand if
          # the tooling is ever the thing that is broken.
          #
          # --no-owner and --no-privileges so it restores into a fresh project
          # without every GRANT failing on roles that do not exist there yet.
          # Read-only. pg_dump takes ACCESS SHARE locks, which do not block
          # anybody using the site while this runs.
          "$PG_DUMP" "$DB_URL" \
            --no-owner --no-privileges --clean --if-exists \
            --quote-all-identifiers \
            -f "dump.sql"

          BYTES=$(stat -c%s dump.sql)
          echo "dump is $BYTES bytes"
          # A dump that is suspiciously small is a failed dump that exited 0.
          # Better to fail loudly than to quietly overwrite a good backup.
          if [ "$BYTES" -lt 100000 ]; then
            echo "That is too small to be a real dump. Refusing to store it."; exit 1
          fi

          gzip -9 dump.sql
          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$PASSPHRASE" \
            -o "dump-${STAMP}.sql.gz.gpg" dump.sql.gz
          rm -f dump.sql.gz

          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Push it to the private backup repository
        env:
          STAMP: ${{ env.STAMP }}
          REPO: ${{ secrets.BACKUP_REPO }}
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          DUMP="dump-${STAMP}.sql.gz.gpg"

          git clone --depth=1 "https://x-access-token:${TOKEN}@github.com/${REPO}.git" backup-repo \
            || { mkdir backup-repo && cd backup-repo && git init -q && cd ..; }

          mv "$DUMP" backup-repo/
          cd backup-repo

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Thirty days in the tree. Older ones stay in git history, which is
          # what makes an older restore possible at all; this only keeps a
          # clone of the backup repository small.
          find . -maxdepth 1 -name "dump-*.sql.gz.gpg" -mtime +30 -delete || true

          cat > README.md <<'EOF'
          # Encrypted database backups

          Written daily by the Backup workflow in the yakal repository. Do not
          edit by hand.

          Each file is a `pg_dump` of the production database, gzipped and
          encrypted with AES256 using `BACKUP_PASSPHRASE`.

          To restore one, from a checkout of the yakal repository:

              BACKUP_PASSPHRASE=... scripts/restore-backup.sh dump-YYYY-MM-DD.sql.gz.gpg

          Restore into a scratch project first. A backup nobody has restored is
          a belief, not a backup.

          **This repository must stay private.** These dumps contain every
          parent's email and phone, every child's name, and every message
          between a child and an adult. The workflow refuses to push here if
          this repository is ever made public, which is a safety net and not a
          reason to try it.

          These dumps cover the database only. The `resumes` storage bucket is
          not included; its file bytes live in Supabase Storage, which a
          database accident does not touch.
          EOF

          git add -A
          git commit -m "backup ${STAMP}" || { echo "nothing changed"; exit 0; }
          git branch -M main
          git push -u origin main

      - name: Say what happened
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### Backup stored: ${{ env.STAMP }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Backup FAILED. The database has no copy from today." >> "$GITHUB_STEP_SUMMARY"
          fi
