name: CI

# Proves the app still builds. Catches a broken import or a bad merge before
# Vercel does, and before anyone else pulls it.
#
# Type checking is deliberately not a gate yet: `tsc --noEmit` currently
# reports 38 unused-import errors that predate this workflow. Turn the step
# below on once they are cleared, or it fails on day one and gets ignored.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # - name: Type check
      #   run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Report bundle size
        run: du -sh dist && ls -lhS dist/assets/*.js | head -5
