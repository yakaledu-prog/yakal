name: CI

# Runs what Vercel runs, so a build that would fail the deploy fails here
# first, on the pull request, rather than after merging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc --noEmit && vite build, the same as the deploy.
      - name: Build
        run: npm run build

      - name: Report bundle size
        run: du -sh dist && ls -lhS dist/assets/*.js | head -5
